<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Умный подбор подрядчиков</title>
  <style>
    :root { --ink: #222326; --paper: #f5f5f7; --line: rgba(34, 35, 38, 0.12); --muted: #6e6e73; --accent: #ff6700; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; line-height: 1.47; -webkit-font-smoothing: antialiased; }
    main { max-width: 980px; margin: 0 auto; padding: 56px 24px 88px; }
    h1 { font-size: 44px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; margin: 0; overflow-wrap: anywhere; }
    .mark { color: var(--accent); margin-right: 10px; font-weight: 500; }
    .lead { max-width: 38rem; color: var(--muted); margin: 14px 0 0; }
    .top { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
    .admin-link { color: var(--muted); text-decoration: none; font-size: 14px; padding-top: 12px; white-space: nowrap; }
    .admin-link:hover { color: var(--ink); }
    .langs { display: inline-flex; gap: 2px; margin-top: 22px; padding: 3px; background: #e8e8ed; border-radius: 999px; }
    .langs button { background: transparent; color: var(--ink); border: 0; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; }
    .langs button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
    form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 14px; margin: 28px 0 8px; min-width: 0; padding: 24px; background: #fff; border-radius: 28px; }
    label { display: flex; flex-direction: column; gap: 8px; min-width: 0; max-width: 100%; font-size: 12px; color: var(--muted); }
    input, select { width: 100%; min-width: 0; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #fbfbfd; color: var(--ink); padding: 12px 14px; font: inherit; font-size: 16px; }
    input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255, 103, 0, 0.16); }
    fieldset.checks { grid-column: 1 / -1; margin: 4px 0 0; padding: 0; border: 0; }
    legend { font-size: 12px; color: var(--muted); padding: 0; margin-bottom: 10px; }
    #services { display: flex; flex-wrap: wrap; gap: 8px; }
    #services label { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; background: var(--paper); border-radius: 999px; padding: 8px 12px; }
    #services input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    #budget-custom { margin-top: 8px; }
    button { font: inherit; border: 0; cursor: pointer; }
    form > button { grid-column: 1 / -1; justify-self: start; background: var(--ink); color: #fff; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
    form > button:hover { background: #000; }
    .error { color: #b42318; }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .presets button { background: #fff; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; }
    .presets button:hover { background: #fff4ec; }
    #outcome { margin: 22px 0 0; padding: 16px 18px; background: #fff; border-radius: 18px; }
    #outcome.matched { box-shadow: inset 3px 0 0 var(--accent); }
    #outcome.blocked, #outcome.no_category { box-shadow: inset 3px 0 0 #b42318; }
    .meta { margin: 0; color: var(--muted); font-size: 14px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .badge { font-size: 12px; background: var(--paper); border-radius: 999px; padding: 4px 10px; }
    .badge.synthetic { background: #fff1e8; color: #9a3412; font-weight: 600; }
    .cards { display: grid; gap: 12px; margin-top: 28px; }
    article { background: #fff; border-radius: 24px; padding: 22px 24px 20px; }
    .place { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin: 0; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
    h2 { margin: 12px 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; }
    h3 { margin: 40px 0 12px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .score { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
    .wrap { overflow-x: auto; background: #fff; border-radius: 24px; max-width: 100%; }
    article h2, li, caption { overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--line); padding: 12px 16px; text-align: left; font-weight: 500; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; }
    tbody th { color: var(--ink); }
    caption { caption-side: bottom; text-align: left; padding: 12px 16px 16px; color: var(--muted); font-size: 13px; }
    ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    li { background: #fff; border-radius: 16px; padding: 14px 16px; color: var(--ink); }
    @media (max-width: 800px) {
      h1 { font-size: 34px; }
      .top { flex-direction: column; gap: 8px; }
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1><span class="mark" aria-hidden="true">ⓐ</span><span data-i18n="title">Умный подбор подрядчиков</span></h1>
      <a class="admin-link" href="/admin" data-i18n="admin">Панель администратора</a>
    </div>
    <p class="lead" data-i18n="lead">Укажите город, дату, тип мероприятия, категорию подрядчика и бюджет. Длительность и язык можно не заполнять. В ответе не больше трёх карточек, и только из тех, кто свободен в эту дату.</p>
    <div class="presets">
      <button type="button" data-preset="dense" data-i18n="presetDense">Плотная категория</button>
      <button type="button" data-preset="rare" data-i18n="presetRare">Редкая категория</button>
      <button type="button" data-preset="empty" data-i18n="presetEmpty">Все заняты</button>
      <button type="button" data-preset="missing" data-i18n="presetMissing">Нет категории в городе</button>
    </div>
    <div class="langs" role="group" data-i18n-label="languages">
      <button type="button" data-lang="ru" aria-pressed="true">Русский</button>
      <button type="button" data-lang="kz" aria-pressed="false">Қазақша</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
    <form id="search">
      <label><span data-i18n="city">Город</span><select name="city" id="city" required></select></label>
      <label><span data-i18n="date">Дата</span><input name="date" id="date" type="date" value="2026-10-14" required></label>
      <label><span data-i18n="format">Тип мероприятия</span><select name="format" id="format" required></select></label>
      <label><span data-i18n="category">Категория подрядчика</span><select name="category" id="category" required></select></label>
      <label><span data-i18n="budget">Бюджет, тг</span><input name="budget" id="budget" inputmode="numeric" value="1 500 000" required></label>
      <label><span data-i18n="duration">Длительность, ч</span><input name="duration" id="duration" inputmode="numeric" data-i18n-placeholder="optional"></label>
      <label><span data-i18n="eventLanguage">Язык</span><select name="language" id="language"></select></label>
      <button type="submit" data-i18n="submit">Подобрать</button>
    </form>
    <p id="error" class="error" hidden></p>
    <p id="outcome" hidden></p>
    <section id="cards" class="cards"></section>
    <h3 id="compare-title" data-i18n="compare">Сравнение</h3>
    <div class="wrap"><table id="compare"></table></div>
    <h3 id="rejected-title" data-i18n="rejectedTitle">Почему остальные не вошли</h3>
    <ol id="rejected"></ol>
  </main>
  <script>
    const I18N = {
      ru: {
        title: "Умный подбор подрядчиков",
        admin: "Панель администратора",
        lead: "Укажите город, дату, тип мероприятия, категорию подрядчика и бюджет. Длительность и язык можно не заполнять. В ответе не больше трёх карточек, и только из тех, кто свободен в эту дату.",
        languages: "Язык интерфейса",
        presetDense: "Плотная категория",
        presetRare: "Редкая категория",
        presetEmpty: "Та же заявка, 12 декабря",
        presetMissing: "Нет категории в городе",
        city: "Город",
        date: "Дата",
        format: "Тип мероприятия",
        category: "Категория подрядчика",
        budget: "Бюджет, тг",
        duration: "Длительность, ч",
        optional: "не обязательно",
        eventLanguage: "Язык",
        any: "не важно",
        submit: "Подобрать",
        compare: "Сравнение",
        rejectedTitle: "Кто из этой категории не прошёл",
        price: "Цена от, тг",
        langs: "Языки",
        hours: "Лимит часов",
        hoursOpen: "не задан",
        flags: "Пометки",
        synthetic: "синтетический профиль",
        priceImputed: "цена ориентировочная",
        cityImputed: "город проставлен при подготовке",
        order: "Порядок: наименьшая цена «от», затем id. Это не оценка качества.",
        failed: "Не удалось подобрать подрядчиков."
      },
      kz: {
        title: "Мердігерлерді ақылды іріктеу",
        admin: "Әкімші панелі",
        lead: "Қала, күн, іс-шара түрі, мердігер санаты және бюджетті көрсетіңіз. Ұзақтық пен тілді бос қалдыруға болады. Жауапта ең көбі үш карточка, әрі сол күні бос болғандар ғана.",
        languages: "Интерфейс тілі",
        presetDense: "Жиі санат",
        presetRare: "Сирек санат",
        presetEmpty: "Сол өтінім, 12 желтоқсан",
        presetMissing: "Қалада санат жоқ",
        city: "Қала",
        date: "Күні",
        format: "Іс-шара түрі",
        category: "Мердігер санаты",
        budget: "Бюджет, тг",
        duration: "Ұзақтығы, сағ",
        optional: "міндетті емес",
        eventLanguage: "Тіл",
        any: "бәрібір",
        submit: "Іріктеу",
        compare: "Салыстыру",
        rejectedTitle: "Осы санаттан кім өтпеді",
        price: "Бастапқы баға, тг",
        langs: "Тілдер",
        hours: "Сағат шегі",
        hoursOpen: "көрсетілмеген",
        flags: "Белгілер",
        synthetic: "синтетикалық профиль",
        priceImputed: "баға бағдарлы",
        cityImputed: "қала дайындау кезінде қойылған",
        order: "Рет: ең төмен бастапқы баға, содан id. Бұл сапа бағасы емес.",
        failed: "Мердігерлерді іріктеу мүмкін болмады."
      },
      en: {
        title: "Smart contractor matching",
        admin: "Admin panel",
        lead: "Set the city, date, event type, contractor category, and budget. Duration and language are optional. At most three cards are returned, and only for people free on that date.",
        languages: "Interface language",
        presetDense: "Dense category",
        presetRare: "Rare category",
        presetEmpty: "Same request, 12 December",
        presetMissing: "No category in the city",
        city: "City",
        date: "Date",
        format: "Event type",
        category: "Contractor category",
        budget: "Budget, KZT",
        duration: "Duration, hours",
        optional: "optional",
        eventLanguage: "Language",
        any: "any",
        submit: "Match",
        compare: "Comparison",
        rejectedTitle: "Who in this category did not pass",
        price: "Price from, KZT",
        langs: "Languages",
        hours: "Hour limit",
        hoursOpen: "not set",
        flags: "Marks",
        synthetic: "synthetic profile",
        priceImputed: "indicative price",
        cityImputed: "city filled during preparation",
        order: "Order: lowest starting price, then id. This is not a quality score.",
        failed: "Could not match contractors."
      }
    };

    const PRESETS = {
      dense: { city: "Алматы", date: "2026-10-14", format: "корпоратив", category: "Ведущий", budget: "1 500 000", duration: "", language: "" },
      rare: { city: "Алматы", date: "2026-10-14", format: "свадьба", category: "Флорист", budget: "500 000", duration: "", language: "" },
      empty: { city: "Алматы", date: "2026-12-12", format: "корпоратив", category: "Ведущий", budget: "1 500 000", duration: "", language: "" },
      missing: { city: "Астана", date: "2026-11-14", format: "конференция", category: "Ресторан", budget: "2 000 000", duration: "", language: "" }
    };

    const form = document.querySelector("#search");
    const cards = document.querySelector("#cards");
    const rejected = document.querySelector("#rejected");
    const error = document.querySelector("#error");
    const compare = document.querySelector("#compare");
    const outcome = document.querySelector("#outcome");
    let lang = "ru";
    let requestId = 0;

    function money(value) {
      return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function fillSelect(id, items, selected, blank) {
      const select = document.querySelector("#" + id);
      const current = selected || select.value;
      select.replaceChildren();
      if (blank) {
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = I18N[lang].any;
        select.appendChild(empty);
      }
      items.forEach((item) => {
        const option = document.createElement("option");
        option.value = String(item.value);
        option.textContent = item.label;
        select.appendChild(option);
      });
      const values = [...select.options].map((option) => option.value);
      select.value = values.includes(current) ? current : (blank ? "" : values[0]);
    }

    async function loadOptions() {
      const response = await fetch("/api/options?lang=" + lang);
      const options = await response.json();
      const keep = (id, fallback) => document.querySelector("#" + id).value || fallback;
      fillSelect("city", options.cities, keep("city", "Алматы"), false);
      fillSelect("format", options.formats, keep("format", "корпоратив"), false);
      fillSelect("category", options.categories, keep("category", "Ведущий"), false);
      fillSelect("language", options.languages, keep("language", ""), true);
    }

    function applyChrome() {
      const text = I18N[lang];
      document.documentElement.lang = lang === "kz" ? "kk" : lang;
      document.title = text.title;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        node.textContent = text[node.dataset.i18n];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
        node.setAttribute("placeholder", text[node.dataset.i18nPlaceholder] || "");
      });
      document.querySelector("[data-i18n-label]").setAttribute("aria-label", text.languages);
      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.lang === lang ? "true" : "false");
      });
    }

    function markItems(card) {
      const text = I18N[lang];
      const items = [];
      if (card.synthetic) items.push([text.synthetic, "synthetic"]);
      if (card.price_imputed) items.push([text.priceImputed, ""]);
      if (card.city_imputed) items.push([text.cityImputed, ""]);
      return items;
    }

    function fillMarks(node, card) {
      const items = markItems(card);
      node.replaceChildren();
      items.forEach(([label, kind]) => {
        const badge = document.createElement("span");
        badge.className = kind ? "badge " + kind : "badge";
        badge.textContent = label;
        node.appendChild(badge);
      });
      node.hidden = items.length === 0;
    }

    function show(data) {
      const text = I18N[lang];
      error.hidden = true;
      outcome.hidden = false;
      outcome.className = data.outcome || "";
      outcome.textContent = data.summary || "";
      cards.replaceChildren();
      (data.cards || []).forEach((card, index) => {
        const article = document.createElement("article");
        const place = document.createElement("p");
        place.className = "place";
        place.textContent = String(index + 1);
        const title = document.createElement("h2");
        title.textContent = card.name;
        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = card.category + " · " + card.city + " · " + money(card.price_from) + " тг";
        const badges = document.createElement("p");
        badges.className = "badges";
        fillMarks(badges, card);
        const body = document.createElement("p");
        body.textContent = card.explanation;
        article.append(place, title, meta, badges, body);
        cards.appendChild(article);
      });

      compare.replaceChildren();
      if (data.cards && data.cards.length) {
        const head = document.createElement("tr");
        const corner = document.createElement("th");
        corner.textContent = text.compare;
        head.appendChild(corner);
        data.cards.forEach((card) => {
          const cell = document.createElement("th");
          cell.textContent = card.name;
          head.appendChild(cell);
        });
        const rows = [
          [text.price, (card) => money(card.price_from) + (card.price_imputed ? " · " + text.priceImputed : "")],
          [text.langs, (card) => (card.languages || []).join(", ")],
          [text.hours, (card) => card.max_hours == null ? text.hoursOpen : String(card.max_hours)],
          [text.flags, (card) => markItems(card).map((item) => item[0]).join(", ") || "—"]
        ];
        const body = document.createElement("tbody");
        rows.forEach(([label, value]) => {
          const row = document.createElement("tr");
          const name = document.createElement("th");
          name.textContent = label;
          row.appendChild(name);
          data.cards.forEach((card) => {
            const cell = document.createElement("td");
            cell.textContent = value(card);
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
        const caption = document.createElement("caption");
        caption.textContent = text.order;
        const thead = document.createElement("thead");
        thead.appendChild(head);
        compare.append(caption, thead, body);
      }

      const hasCards = Boolean(data.cards && data.cards.length);
      const hasFailed = Boolean(data.failed && data.failed.length);
      document.querySelector("#compare-title").hidden = !hasCards;
      document.querySelector("#rejected-title").hidden = !hasFailed;
      rejected.replaceChildren();
      (data.failed || []).forEach((item) => {
        const line = document.createElement("li");
        line.textContent = item.name + " — " + item.reason;
        rejected.appendChild(line);
      });
    }

    async function run(event) {
      if (event) event.preventDefault();
      const current = ++requestId;
      const params = new URLSearchParams(new FormData(form));
      params.set("budget", (params.get("budget") || "").replace(/[\s\u00a0\u202f\u2009]/g, ""));
      const duration = (params.get("duration") || "").replace(/[\s\u00a0\u202f\u2009]/g, "");
      if (duration) params.set("duration", duration);
      else params.delete("duration");
      if (!params.get("language")) params.delete("language");
      params.set("lang", lang);
      const response = await fetch("/api/match?" + params.toString());
      const data = await response.json();
      if (current !== requestId) return;
      if (!response.ok) {
        error.hidden = false;
        error.textContent = data.error || I18N[lang].failed;
        outcome.hidden = true;
        return;
      }
      show(data);
    }

    document.querySelectorAll("[data-preset]").forEach((button) => {
      button.addEventListener("click", () => {
        const preset = PRESETS[button.dataset.preset];
        document.querySelector("#city").value = preset.city;
        document.querySelector("#date").value = preset.date;
        document.querySelector("#format").value = preset.format;
        document.querySelector("#category").value = preset.category;
        document.querySelector("#budget").value = preset.budget;
        document.querySelector("#duration").value = preset.duration;
        document.querySelector("#language").value = preset.language;
        run();
      });
    });
    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.addEventListener("click", async () => {
        lang = button.dataset.lang;
        applyChrome();
        await loadOptions();
        run();
      });
    });
    form.addEventListener("input", () => {
      error.hidden = true;
    });
    form.addEventListener("submit", run);
    applyChrome();
    loadOptions().then(run);
</script>
</body>
</html>
